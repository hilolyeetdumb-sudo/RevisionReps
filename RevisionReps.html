<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>RevisionReps</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@700;800&family=Barlow:wght@400;600&display=swap">
<style>
:root{--bg:#fff;--sf:#fff;--tx:#0b1b3d;--mu:#4f5d7a;--ac:#0b2a6b;--ai:#fff;--bd:#cfd7e6;--ok:#12805c;--no:#c4361f;--dot:#7f9bd6;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font:400 1.05rem/1.55 Barlow,system-ui,-apple-system,"Segoe UI",sans-serif}
main{max-width:680px;margin:0 auto;padding:20px 20px 64px}
h1,h2,h3,.logo,.row b{font-family:"Barlow Condensed","Arial Narrow",Impact,sans-serif;font-weight:800;margin:0}
h1{font-size:clamp(2.6rem,10vw,4.6rem);line-height:.95;margin:36px 0 18px;letter-spacing:-.01em}
h2{font-size:1.9rem;line-height:1.1;margin:32px 0 12px}
h3{font-size:1.3rem;margin:24px 0 8px}
p{margin:0 0 14px;max-width:60ch}
.top{display:flex;justify-content:space-between;align-items:center;gap:12px}
.logo{font-size:1.5rem;display:flex;align-items:center;gap:8px;background:none;border:0;color:var(--tx);cursor:pointer;padding:0}
.logo i{width:10px;height:26px;background:var(--ac);border-radius:2px;display:block}
.badge{background:var(--ac);color:#fff;font-weight:600;padding:4px 12px;border-radius:99px;font-size:.95rem;white-space:nowrap}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible{outline:3px solid var(--ac);outline-offset:2px}
.cta{background:var(--ac);color:var(--ai);border:0;border-radius:10px;padding:14px 22px;font-weight:600;font-size:1.05rem}
.ghost{background:none;border:2px solid var(--bd);border-radius:10px;padding:12px 20px;font-weight:600}
.row{display:flex;justify-content:space-between;align-items:center;gap:12px;width:100%;text-align:left;background:var(--ac);color:#fff;border:0;border-radius:12px;padding:16px 18px;margin-bottom:10px;transition:transform .12s}
.row:hover{transform:translateX(4px)}
.row b{font-size:1.55rem;line-height:1.1}
.row small{display:block;color:#c5d3f2;font-size:.9rem}
.subs{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:10px}
.subs .row{margin:0}
.row[disabled]{opacity:.5;cursor:default}
.row[disabled]:hover{transform:none}
.plates{display:flex;gap:5px;flex-shrink:0;flex-wrap:wrap;justify-content:flex-end;max-width:90px}
.plates span{width:12px;height:12px;border-radius:50%;border:2px solid var(--dot)}
.plates span.on{background:#fff;border-color:#fff}
.fact{background:var(--ac);color:#fff;padding:12px 16px;margin:0 0 10px;border-radius:10px}
.bar{height:8px;background:var(--bd);border-radius:99px;overflow:hidden;margin:20px 0 6px}
.bar div{height:100%;background:var(--ac);transition:width .25s}
.meta{color:var(--mu);font-size:.95rem;margin:0}
.q{font-size:1.3rem;font-weight:600;line-height:1.35;margin:18px 0}
.opt{display:block;width:100%;text-align:left;background:var(--sf);border:2px solid var(--bd);border-radius:12px;padding:13px 16px;margin-bottom:10px;font-size:1.05rem}
.opt:not([disabled]):hover{border-color:var(--ac)}
.opt.good{border-color:var(--ok);background:#e6f4ee}
textarea{width:100%;font:inherit;color:var(--tx);background:#fff;border:2px solid var(--bd);border-radius:12px;padding:12px;margin:0 0 14px;resize:vertical}
textarea:focus-visible{outline:3px solid var(--ac);outline-offset:2px}
.tick{display:flex;gap:10px;align-items:flex-start;padding:8px 0;cursor:pointer}
.tick input{width:22px;height:22px;margin-top:2px;accent-color:var(--ac);flex-shrink:0}
.seg{display:flex;margin:16px 0}
.seg button{flex:1;padding:10px 14px;border:2px solid var(--ac);background:#fff;color:var(--ac);font-weight:600}
.seg button:first-child{border-radius:10px 0 0 10px}
.seg button:last-child{border-radius:0 10px 10px 0;border-left:0}
.seg button.on{background:var(--ac);color:#fff}
summary{cursor:pointer;margin-bottom:8px}
@media print{.top,.acts,.foot,button,.note:last-child{display:none!important}main{max-width:none;padding:0}.fact{background:#fff;color:#000;border:1px solid #000}}
.opt.bad{border-color:var(--no)}
.why{border-left:4px solid var(--ok);padding:4px 14px;margin:16px 0}
.why.no{border-color:var(--no)}
.score{font-family:"Barlow Condensed",Impact,sans-serif;font-weight:800;font-size:5rem;line-height:1;margin:20px 0 8px}
.acts{display:flex;gap:10px;flex-wrap:wrap;margin-top:18px}
.note,.foot{color:var(--mu);font-size:.9rem}
.foot{margin-top:40px}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<main>
<div class="top"><button class="logo" id="home" aria-label="RevisionReps home"><i></i>RevisionReps</button><span class="badge" id="cnt"></span></div>

<p class="foot">Original practice material written for RevisionReps. Not affiliated with or endorsed by AQA.</p>

<script>
var T=[
{id:"cell",n:"Cell biology",f:["Eukaryotic cells (plant and animal) have a nucleus. Prokaryotic cells, like bacteria, have their DNA free in the cytoplasm.","Mitochondria release energy in aerobic respiration, ribosomes make proteins, and chloroplasts (plants only) carry out photosynthesis.","Diffusion moves particles from high to low concentration. Osmosis is the diffusion of water across a partially permeable membrane. Active transport moves substances against the gradient and needs energy."],q:[
{q:"Which part of a cell is the site of aerobic respiration?",o:["Ribosome","Chloroplast","Mitochondrion","Vacuole"],a:2,e:"Mitochondria contain the enzymes for aerobic respiration. Ribosomes make proteins and chloroplasts carry out photosynthesis."},
{q:"How does active transport differ from diffusion?",o:["It moves particles down a concentration gradient","It moves particles against a concentration gradient using energy","It only moves water","It needs no energy"],a:1,e:"Active transport works against the concentration gradient, so the cell has to use energy from respiration."},
{q:"A potato chip is left in a very concentrated sugar solution. What happens to its mass?",o:["It increases because water enters","It stays the same","It decreases because water leaves by osmosis","It increases because sugar enters"],a:2,e:"Water moves from the dilute solution inside the chip to the more concentrated solution outside, so the chip loses mass."},
{q:"Which structure controls the movement of substances into and out of an animal cell?",o:["Cell membrane","Cell wall","Nucleus","Cytoplasm"],a:0,e:"The cell membrane is partially permeable, so it controls what enters and leaves."},
{q:"A cell has a diameter of 0.02 mm. What is this in micrometres (µm)?",o:["0.2 µm","2 µm","20 µm","200 µm"],a:2,e:"1 mm = 1000 µm, so 0.02 × 1000 = 20 µm."},
{q:"What is the function of the cell wall in a plant cell?",o:["To release energy","To strengthen the cell and give support","To make proteins","To control the nucleus"],a:1,e:"Cell walls made of cellulose strengthen and support the cell."},
{q:"Mitosis in a body cell produces:",o:["Four genetically different cells","Two genetically identical cells","Two cells with half the chromosomes","One larger cell"],a:1,e:"Mitosis makes two genetically identical daughter cells, used for growth and repair."},
{q:"What is a stem cell?",o:["A cell that can only make red blood cells","A dead cell","An undifferentiated cell that can become other cell types","A cell with no nucleus"],a:2,e:"Stem cells are undifferentiated and can differentiate into specialised cells."},
{q:"Why does a red blood cell have no nucleus?",o:["To make room for more haemoglobin","To help it divide","To stop it using oxygen","To make it larger"],a:0,e:"No nucleus leaves more space for haemoglobin, which carries oxygen."},
{q:"Which is an example of diffusion in the human body?",o:["Glucose absorbed from the gut when its concentration is low","Oxygen moving from the alveoli into the blood","Mineral ions entering root hair cells","Sodium ions pumped out of a nerve cell"],a:1,e:"Oxygen moves down its concentration gradient. The other three involve active transport."}]},
{id:"org",n:"Organisation",f:["Amylase breaks starch down into sugars, protease breaks proteins into amino acids, and lipase breaks lipids into fatty acids and glycerol.","Bile is made in the liver and stored in the gall bladder. It neutralises stomach acid and emulsifies fat to give lipase a bigger surface area.","The right side of the heart pumps blood to the lungs. The left side pumps oxygenated blood around the body."],q:[
{q:"Where is bile stored?",o:["Liver","Pancreas","Small intestine","Gall bladder"],a:3,e:"Bile is made in the liver but stored in the gall bladder until it is released into the small intestine."},
{q:"Which enzyme breaks down proteins?",o:["Protease","Amylase","Lipase","Catalase"],a:0,e:"Protease breaks proteins into amino acids. Amylase works on starch and lipase on fats."},
{q:"Which vessel carries oxygenated blood from the lungs to the heart?",o:["Pulmonary artery","Aorta","Vena cava","Pulmonary vein"],a:3,e:"The pulmonary vein returns oxygenated blood to the left atrium. Veins carry blood towards the heart."},
{q:"Which test shows that a food contains starch?",o:["Biuret solution turns purple","Iodine turns blue-black","Benedict’s solution turns brick red","Ethanol turns cloudy"],a:1,e:"Iodine turns blue-black with starch. Biuret tests for protein and Benedict’s for sugars."},
{q:"What do the coronary arteries do?",o:["Carry blood to the lungs","Supply the heart muscle with oxygenated blood","Carry blood from the body to the heart","Take blood to the brain"],a:1,e:"Coronary arteries supply the heart muscle, so a blockage can cause a heart attack."},
{q:"Which part of a leaf is the main site of photosynthesis?",o:["Upper epidermis","Palisade mesophyll","Spongy mesophyll","Guard cells"],a:1,e:"Palisade cells are packed with chloroplasts and sit near the top of the leaf."},
{q:"Which tissue carries water up a plant from the roots?",o:["Phloem","Stomata","Xylem","Palisade"],a:2,e:"Xylem carries water and mineral ions upwards. Phloem carries sugars."},
{q:"A resting heart rate is 70 beats per minute and each beat pumps 75 cm³ of blood. What is the cardiac output?",o:["145 cm³/min","5250 cm³/min","525 cm³/min","0.93 cm³/min"],a:1,e:"Cardiac output = heart rate × stroke volume = 70 × 75 = 5250 cm³/min."},
{q:"What is the main effect of statins?",o:["They lower blood cholesterol","They replace damaged valves","They lower blood glucose","They speed up the heart"],a:0,e:"Statins reduce blood cholesterol, lowering the risk of fatty deposits in arteries."},
{q:"What is the job of a stent in a coronary artery?",o:["To lower cholesterol","To pump blood","To hold the artery open","To replace a valve"],a:2,e:"A stent is a mesh tube that keeps the artery open so blood can flow."}]},
{id:"inf",n:"Infection and response",f:["Pathogens are bacteria, viruses, fungi or protists. They spread through air, water and direct contact.","White blood cells defend you by engulfing pathogens (phagocytosis), making antibodies and making antitoxins.","Vaccines contain a dead or inactive form of a pathogen. They trigger antibodies and memory cells so a later infection is fought off quickly."],q:[
{q:"Why are antibiotics no use against a virus?",o:["Antibiotics kill bacteria but not viruses","Viruses are too large","Viruses only live outside the body","Antibiotics make viruses mutate"],a:0,e:"Antibiotics target bacteria. Viruses live inside your cells, so they need different treatments."},
{q:"What is the name for a white blood cell engulfing a pathogen?",o:["Osmosis","Mitosis","Transpiration","Phagocytosis"],a:3,e:"In phagocytosis the white blood cell surrounds the pathogen and digests it."},
{q:"How does a vaccine protect you?",o:["It kills the pathogen directly","It makes your body produce antibodies and memory cells without causing the disease","It gives you antibiotics","It makes your skin a barrier"],a:1,e:"The inactive pathogen triggers an immune response, and memory cells let your body respond fast next time."},
{q:"Which type of pathogen causes malaria?",o:["Virus","Bacterium","Fungus","Protist"],a:3,e:"Malaria is caused by a protist, spread by mosquitoes acting as vectors."},
{q:"What does HIV do if it is not treated?",o:["Attacks the immune system’s white blood cells","Attacks the liver","Damages the skin only","Stops the heart"],a:0,e:"HIV attacks white blood cells and can lead to AIDS."},
{q:"Which of these is a non-specific defence of the body?",o:["Antibodies","Stomach acid","Memory cells","Antitoxins"],a:1,e:"Stomach acid kills pathogens in food. The others are specific immune responses."},
{q:"How do bacteria become resistant to antibiotics?",o:["Antibiotics make them mutate on purpose","Resistant bacteria survive and reproduce","They learn from the patient","The immune system helps them"],a:1,e:"Random mutations create resistant bacteria, which survive treatment and pass on the trait."},
{q:"Rose black spot is caused by a:",o:["Virus","Fungus","Bacterium","Protist"],a:1,e:"Rose black spot is a fungal disease that makes purple or black spots on leaves."},
{q:"Why is a placebo used in a clinical trial?",o:["To cure the patient","To compare results with those from the real drug","To make the drug cheaper","To speed up testing"],a:1,e:"A placebo contains no drug, so any difference can be linked to the drug itself."},
{q:"How does a monoclonal antibody find its target cell?",o:["It binds to a specific antigen","It dissolves the cell","It absorbs water","It makes the cell divide"],a:0,e:"Each monoclonal antibody binds only to its matching antigen, for example on a cancer cell."}]},
{id:"bio",n:"Bioenergetics",f:["Photosynthesis: carbon dioxide + water makes glucose + oxygen, using light energy. It is an endothermic reaction.","Limiting factors of photosynthesis are light intensity, carbon dioxide concentration and temperature.","Aerobic respiration uses oxygen. Anaerobic respiration makes lactic acid in muscles, and ethanol and carbon dioxide in yeast."],q:[
{q:"What are the products of photosynthesis?",o:["Carbon dioxide and water","Glucose and oxygen","Lactic acid and oxygen","Glucose and carbon dioxide"],a:1,e:"Plants turn carbon dioxide and water into glucose and release oxygen."},
{q:"What does anaerobic respiration in muscle cells produce?",o:["Ethanol and carbon dioxide","Carbon dioxide and water","Oxygen","Lactic acid"],a:3,e:"In animals, anaerobic respiration makes lactic acid. Yeast makes ethanol and carbon dioxide."},
{q:"Light intensity is increased but the rate of photosynthesis stops rising. Why?",o:["Plants cannot use light","Another factor, such as carbon dioxide, is now limiting","The chlorophyll has been destroyed","Glucose has run out"],a:1,e:"Once light is no longer the limiting factor, something else like carbon dioxide or temperature holds the rate back."},
{q:"Which gas do plants take in for photosynthesis?",o:["Oxygen","Nitrogen","Carbon dioxide","Hydrogen"],a:2,e:"Carbon dioxide diffuses into the leaf through the stomata."},
{q:"Photosynthesis is endothermic. What does this mean?",o:["It releases energy to the surroundings","It takes in energy from the surroundings","It makes oxygen","It needs no energy"],a:1,e:"Endothermic reactions take in energy, here from light."},
{q:"Which is the word equation for aerobic respiration?",o:["Glucose + oxygen → carbon dioxide + water","Glucose → lactic acid","Carbon dioxide + water → glucose + oxygen","Glucose → ethanol + carbon dioxide"],a:0,e:"Aerobic respiration uses oxygen to release energy from glucose."},
{q:"Why do heart rate and breathing rate rise during exercise?",o:["To supply muscles with more oxygen and glucose","To make less carbon dioxide","To cool the lungs","To stop respiration"],a:0,e:"Muscles need more oxygen and glucose, and carbon dioxide must be removed faster."},
{q:"What is the oxygen debt?",o:["Oxygen stored in muscles","The extra oxygen needed after exercise to break down lactic acid","Oxygen used in photosynthesis","A lack of oxygen in the air"],a:1,e:"After anaerobic exercise, extra oxygen is needed to break down the lactic acid."},
{q:"Which is a product of anaerobic respiration in yeast?",o:["Lactic acid","Ethanol","Glucose","Oxygen"],a:1,e:"Yeast makes ethanol and carbon dioxide, which is used in brewing and baking."},
{q:"What does a plant convert glucose into for storage?",o:["Cellulose","Starch","Amylase","Haemoglobin"],a:1,e:"Glucose is stored as starch. Cellulose is used to build cell walls."}]},
{id:"hom",n:"Homeostasis and response",f:["Homeostasis keeps internal conditions stable, including temperature, blood glucose and water levels.","The nervous system pathway is stimulus, receptor, sensory neurone, CNS, motor neurone, effector, response. Reflexes are fast and automatic.","Insulin from the pancreas lowers blood glucose. In type 1 diabetes the pancreas does not make enough insulin."],q:[
{q:"Which organ produces insulin?",o:["Liver","Pancreas","Kidney","Stomach"],a:1,e:"The pancreas releases insulin, which causes cells to take up glucose from the blood."},
{q:"Which type of neurone carries impulses from a receptor to the CNS?",o:["Motor neurone","Relay neurone","Sensory neurone","Effector neurone"],a:2,e:"Sensory neurones carry impulses to the CNS. Motor neurones carry them from the CNS to effectors."},
{q:"What is a muscle or gland that responds to a stimulus called?",o:["Effector","Receptor","Hormone","Synapse"],a:0,e:"Effectors carry out the response. Receptors detect the stimulus."},
{q:"Which part of the brain controls heart rate and breathing?",o:["Cerebellum","Cerebral cortex","Medulla","Pituitary gland"],a:2,e:"The medulla controls unconscious activities such as heart rate and breathing."},
{q:"Which gland is often called the master gland?",o:["Thyroid","Pituitary","Adrenal","Ovary"],a:1,e:"The pituitary releases hormones that control other glands."},
{q:"Which hormone prepares the body for fight or flight?",o:["Adrenaline","Insulin","Oestrogen","Thyroxine"],a:0,e:"Adrenaline raises heart rate and boosts blood glucose."},
{q:"What happens when body temperature rises too high?",o:["Shivering starts","Blood vessels constrict","Sweating increases and blood vessels dilate","Hairs stand on end"],a:2,e:"Sweat evaporating and vasodilation help the body lose heat."},
{q:"Which hormone causes ovulation?",o:["Progesterone","Luteinising hormone (LH)","Testosterone","Insulin"],a:1,e:"LH stimulates the release of an egg. FSH makes eggs mature."},
{q:"In type 2 diabetes, body cells:",o:["Make too much insulin","No longer respond properly to insulin","Cannot absorb water","Destroy the pancreas"],a:1,e:"Type 2 diabetes involves insulin resistance, often linked to obesity."},
{q:"Which hormone makes the liver release glucose into the blood?",o:["Insulin","Glucagon","Oestrogen","Progesterone"],a:1,e:"Glucagon raises blood glucose by converting glycogen to glucose."}]},
{id:"inh",n:"Inheritance and evolution",f:["A gene is a section of DNA that codes for a protein. The genome is all of an organism’s genetic material.","A dominant allele shows if one copy is present. A recessive allele needs two copies. Homozygous means two identical alleles and heterozygous means two different ones.","Natural selection: variation exists, better adapted individuals survive and reproduce, and they pass on their alleles."],q:[
{q:"A person has the alleles Bb. What is their genotype called?",o:["Homozygous dominant","Homozygous recessive","Heterozygous","Mutant"],a:2,e:"Two different alleles means heterozygous."},
{q:"Two parents are both Bb, and b is recessive. What is the chance of a child being bb?",o:["0%","25%","50%","75%"],a:1,e:"A Punnett square gives BB, Bb, Bb and bb, so 1 in 4 is bb."},
{q:"How many chromosomes are in a normal human gamete?",o:["46","92","22","23"],a:3,e:"Gametes are haploid with 23 chromosomes. Body cells have 46, in 23 pairs."},
{q:"Which type of cell division produces gametes?",o:["Mitosis","Meiosis","Fertilisation","Osmosis"],a:1,e:"Meiosis halves the chromosome number and produces genetically different gametes."},
{q:"Which sex chromosomes does a human male have?",o:["XX","XY","YY","XO"],a:1,e:"Males are XY and females are XX."},
{q:"What is the chance that a child will be male?",o:["25%","50%","75%","100%"],a:1,e:"Half of sperm carry Y, so the chance is 50%."},
{q:"Which of these causes genetic variation?",o:["Mutation","Photosynthesis","Diffusion","Digestion"],a:0,e:"Mutations create new alleles, along with sexual reproduction."},
{q:"What is selective breeding?",o:["Letting nature choose","Cloning a cell","Choosing parents with desired features to breed","Changing genes with enzymes"],a:2,e:"Humans select organisms with useful features and breed them over many generations."},
{q:"Why can inbreeding be harmful?",o:["It increases the chance of inherited disorders","It always makes animals larger","It stops mutations","It makes alleles dominant"],a:0,e:"Less variation makes it more likely that harmful recessive alleles pair up."},
{q:"Who proposed evolution by natural selection?",o:["Mendel","Darwin","Pasteur","Fleming"],a:1,e:"Darwin published the theory in On the Origin of Species."}]},
{id:"eco",n:"Ecology",f:["Producers make biomass by photosynthesis and start every food chain. Then come primary, secondary and tertiary consumers.","Quadrats estimate population size. Mean per quadrat times total area, divided by the quadrat area, gives the estimate. Transects show change across a habitat.","Photosynthesis takes carbon dioxide out of the air. Respiration, combustion and decay put it back."],q:[
{q:"Which organism starts a food chain?",o:["Producer","Primary consumer","Decomposer","Predator"],a:0,e:"Producers capture energy from sunlight, so every food chain begins with them."},
{q:"A 1 m² quadrat has a mean of 4 daisies. The field is 100 m². Estimate the population.",o:["40","25","104","400"],a:3,e:"4 per m² times 100 m² gives 400 daisies."},
{q:"Which process removes carbon dioxide from the atmosphere?",o:["Respiration","Combustion","Decay","Photosynthesis"],a:3,e:"Plants use carbon dioxide in photosynthesis. The other three processes release it."},
{q:"What is a community in ecology?",o:["All organisms of one species in a habitat","All the populations of different species in a habitat","The non-living parts of a habitat","One organism and its food"],a:1,e:"A community is all the populations living in an area. A population is one species."},
{q:"Which of these is an abiotic factor?",o:["Predators","Disease","Temperature","Food supply"],a:2,e:"Abiotic factors are non-living, such as temperature, light and pH."},
{q:"100 kJ is available at the producer and about 10% is passed on at each stage. How much reaches the primary consumer?",o:["1 kJ","10 kJ","90 kJ","100 kJ"],a:1,e:"10% of 100 kJ is 10 kJ. The rest is lost as heat, waste and movement."},
{q:"What do decomposers do?",o:["Make glucose","Break down dead material","Carry out photosynthesis","Eat only producers"],a:1,e:"Decomposers break down dead plants and animals, returning nutrients to the soil."},
{q:"What is biodiversity?",o:["The variety of living organisms in an ecosystem","The mass of living material","The number of habitats on Earth","The amount of carbon in the air"],a:0,e:"High biodiversity means many different species."},
{q:"Which activity increases carbon dioxide in the atmosphere?",o:["Planting trees","Burning fossil fuels","Restoring peat bogs","Building wind farms"],a:1,e:"Burning fossil fuels releases carbon dioxide stored for millions of years."},
{q:"Why are there fewer organisms at each higher level of a food chain?",o:["Energy is lost at each stage","Predators are always larger","Producers eat consumers","There is more light"],a:0,e:"Energy is lost as heat and waste, so less biomass supports each higher level."}]}
];

cell:[{q:"Explain how a root hair cell is adapted to take in water and mineral ions from the soil.",m:["The long root hair gives a large surface area","Many mitochondria release energy for active transport of mineral ions","Water enters by osmosis because the cell sap is more concentrated than the soil water"]},{q:"A potato cylinder placed in pure water increases in mass. Explain why.",m:["Water moves into the cylinder by osmosis","From a higher water concentration (pure water) to a lower water concentration (inside the cells)","Through the partially permeable cell membranes"]},

{q:"Describe the functions of ribosomes and mitochondria.",m:["Ribosomes are where proteins are made","Mitochondria are where aerobic respiration takes place","This releases energy for the cell"]},

      document.getElementById("ans").readOnly=true;
      document.getElementById("fb").innerHTML="<div class='why'><p><b>Mark scheme.</b> Tick each point your answer made. One mark for each.</p>"+q.m.map(function(x){return"<label class='tick'><input type='checkbox'><span>"+x+"</span></label>"}).join("")+"<p id='sc'><b>0/"+n+"</b></p></div><button class='cta' id='nx'>"+(k==qs.length-1?"See my score":"Next question")+"</button>";
      var bs=app.querySelectorAll("input[type=checkbox]");
      bs.forEach(function(c){c.onchange=function(){document.getElementById("sc").innerHTML="<b>"+count(bs)+"/"+n+"</b>"}});
      document.getElementById("nx").onclick=function(){got+=count(bs);tot+=n;prog.done=(prog.done||0)+1;save();cnt();k++;if(k<qs.length){show()}else{fin()}};
    };
  }
  function fin(){
    app.innerHTML="<h2>Written questions complete</h2><div class='score'>"+got+"/"+tot+"</div><p>"+(got>=tot*.7?"Strong answers. Check any missed points, then go again.":"Read the points you missed, then try again from memory.")+"</p><div class='acts'><button class='cta' id='ag'>Go again</button><button class='ghost' id='tp'>All topics</button></div>";
    document.getElementById("ag").onclick=function(){written(shuf(qs),title,t)};
    document.getElementById("tp").onclick=subject;
    window.scrollTo(0,0);
  }
  show();window.scrollTo(0,0);
}
var CMD=[
{w:"State, name or give",d:"Write a short, direct fact. No explanation is needed.",t:"One fact per mark. Extra detail earns nothing, so keep it short.",q:"State the organ that makes insulin. [1 mark]",a:"The pancreas."},
{w:"Describe",d:"Say what happens or what something looks like, in order. You do not need to give reasons.",t:"Write a step or feature for each mark. Use sequence words like first, then, finally.",q:"Describe how to test a food for starch. [2 marks]",a:"Add iodine solution to the food. If starch is present, the colour changes from orange-brown to blue-black."},
{w:"Explain",d:"Give reasons. Say why or how something happens.",t:"Use because, so and therefore, and link each point to the next. A fact with no reason loses marks.",q:"Explain why an animal cell shrinks in a concentrated sugar solution. [3 marks]",a:"The solution outside has a lower water concentration than the cell. Water moves out of the cell by osmosis through the partially permeable membrane, so the cell loses volume and shrinks."},
{w:"Compare",d:"Describe the similarities and differences between things.",t:"Write about both things in the same sentence, using words like whereas, but and both. Do not describe them separately.",q:"Compare aerobic and anaerobic respiration. [2 marks]",a:"Aerobic respiration uses oxygen whereas anaerobic respiration does not. Aerobic respiration releases much more energy from each glucose molecule than anaerobic respiration."},
{w:"Suggest",d:"Apply what you know to a new situation. The exact answer is not in your notes.",t:"Use the information in the question and your knowledge to give a sensible, reasoned idea.",q:"Suggest why someone who exercises regularly has a lower resting heart rate. [2 marks]",a:"Regular exercise makes the heart muscle stronger. So each beat pumps more blood, and fewer beats are needed to supply the body."},
{w:"Calculate",d:"Work out a numerical answer.",t:"Write the equation, show every step, and add the units. You can get marks for working even if the final answer is wrong.",q:"Calculate the cardiac output when the heart rate is 70 beats per minute and the stroke volume is 75 cm³. [2 marks]",a:"Cardiac output = heart rate × stroke volume = 70 × 75 = 5250 cm³ per minute."},
{w:"Evaluate",d:"Weigh up the evidence for and against, then reach a judgement.",t:"Give points on both sides, then finish with a conclusion and a reason for it. The conclusion earns a mark.",q:"Evaluate the use of statins to reduce the risk of heart disease. [4 marks]",a:"Statins lower blood cholesterol, which reduces fatty deposits in the arteries and the risk of heart attacks. However, they can cause side effects such as muscle pain, and they do not work for everyone. Overall, statins are worth using for people at high risk, because the benefits outweigh the risks for most patients."}];
function today(o){return new Date(Date.now()-(o||0)*864e5).toISOString().slice(0,10)}
function streak(){return prog.streak&&(prog.day==today()||prog.day==today(1))?"<p class='note'>Daily streak: "+prog.streak+" day"+(prog.streak>1?"s":"")+"</p>":""}
function daily(){
  var pool=[],out=[],used={},s=+today().replace(/-/g,"");
  Object.keys(DATA).forEach(function(k){DATA[k].T.forEach(function(t){pool=pool.concat(t.q)})});
  while(out.length<5){s=(s*16807)%2147483647;var i=s%pool.length;if(!used[i]){used[i]=1;out.push(pool[i])}}
  quiz(out,"Daily 5",null);
}
function cmd(){
  app.innerHTML="<h2>Command word guide</h2><p>Exam questions start with a command word that tells you what to write. Knowing it is a quick way to gain marks. Open each example to see a full-marks answer.</p>"+CMD.map(function(c){return"<h3>"+c.w+"</h3><p>"+c.d+"</p><p class='fact'><b>Tip:</b> "+c.t+"</p><details><summary><b>"+c.q+"</b></summary><p class='why'>"+c.a+"</p></details>"}).join("")+"<div class='acts'><button class='ghost' id='bk3'>Back to home</button></div>";
  document.getElementById("bk3").onclick=home;
  window.scrollTo(0,0);
}
function sheet(i){
  var t=T[i],w=W[t.id]||[];
  app.innerHTML="<h2>"+t.n+": cheat sheet</h2><p class='note'>AQA GCSE "+CUR+"</p><h3>Key facts</h3>"+t.f.map(function(x){return"<p class='fact'>"+x+"</p>"}).join("")+"<h3>Key points</h3><ul>"+t.q.map(function(q){return"<li>"+q.e+"</li>"}).join("")+"</ul><h3>Exam answer points</h3>"+w.map(function(x){return"<p><b>"+x.q+"</b></p><ul>"+x.m.map(function(m){return"<li>"+m+"</li>"}).join("")+"</ul>"}).join("")+"<div class='acts'><button class='cta' id='pr'>Print</button><button class='ghost' id='bk4'>Back</button></div><p class='note'>If Print does not open, press Ctrl+P (or Cmd+P on a Mac).</p>";
  document.getElementById("pr").onclick=function(){window.print()};
  document.getElementById("bk4").onclick=function(){topic(i)};
  window.scrollTo(0,0);
}
function rows(f){return T.map(function(t,i){return f(i)?"<button class='row' data-i='"+i+"'><span><b>"+t.n+"</b><small>"+(mode=="w"?W[t.id].length+" written questions":t.q.length+" questions")+"</small></span>"+plates(t)+"</button>":""}).join("")}
function subject(n){
  if(typeof n=="string"){CUR=n;T=DATA[n].T;W=DATA[n].W}
  cnt();
  app.innerHTML="<button class='ghost' id='bkh'>All subjects</button><h2>AQA GCSE "+CUR+"</h2><p class='note'>Exam-style questions written for RevisionReps. For real papers, use AQA’s free past papers.</p><div class='seg'><button id='m1' class='"+(mode=="mc"?"on":"")+"'>Multiple choice</button><button id='m2' class='"+(mode=="w"?"on":"")+"'>Written, self-marked</button></div><label class='tick'><input type='checkbox' id='tm'"+(timed?" checked":"")+"><span>Exam timer: one minute per mark (written questions)</span></label><button class='cta' id='full'>Start a mixed quiz</button><h3>Paper 1</h3>"+rows(function(i){return i<DATA[CUR].k})+"<h3>Paper 2</h3>"+rows(function(i){return i>=DATA[CUR].k})+
  ""+
  "";
  document.getElementById("full").onclick=function(){
    var all=[];T.forEach(function(t){all=all.concat(t.q)});
    if(mode=="w"){var wa=[];T.forEach(function(x){wa=wa.concat(W[x.id])});written(shuf(wa).slice(0,5),"Mixed written questions",null)}else{quiz(shuf(all).slice(0,10),"Mixed quiz",null)}};
  app.querySelectorAll(".row").forEach(function(b){b.onclick=function(){topic(+b.dataset.i)}});
  document.getElementById("bkh").onclick=home;
  document.getElementById("m1").onclick=function(){mode="mc";subject()};
  document.getElementById("m2").onclick=function(){mode="w";subject()};
  document.getElementById("tm").onchange=function(){timed=this.checked};
  window.scrollTo(0,0);
}
function topic(i){
  var t=T[i];
  app.innerHTML="<h2>"+t.n+"</h2><h3>Know this first</h3>"+t.f.map(function(x){return"<p class='fact'>"+x+"</p>"}).join("")+
  "<div class='acts'><button class='cta' id='go'>"+(mode=="w"?"Start written questions ("+W[t.id].length+")":"Start quiz of "+t.q.length)+"</button><button class='ghost' id='sh'>Cheat sheet</button><button class='ghost' id='bk'>All topics</button></div>";
  document.getElementById("go").onclick=function(){mode=="w"?written(shuf(W[t.id]),t.n,t):quiz(shuf(t.q),t.n,t)};
  document.getElementById("bk").onclick=subject;
  document.getElementById("sh").onclick=function(){sheet(i)};
  window.scrollTo(0,0);
}
function quiz(qs,title,t){
  var k=0,score=0;
  function show(){
    var q=qs[k],opts=shuf(q.o.map(function(x,j){return{t:x,c:j===q.a}}));
    app.innerHTML="<h2>"+title+"</h2><div class='bar'><div style='width:"+(k/qs.length*100)+"%'></div></div><p class='meta'>Question "+(k+1)+" of "+qs.length+"</p><p class='q'>"+q.q+"</p><div id='os'></div><div id='fb'></div>";
    var box=document.getElementById("os");
    opts.forEach(function(o){
      var b=document.createElement("button");b.className="opt";b.textContent=o.t;
      b.onclick=function(){
        var all=box.querySelectorAll(".opt");
        all.forEach(function(x,j){x.disabled=true;if(opts[j].c)x.classList.add("good")});
        if(o.c){score++}else{b.classList.add("bad")}
        prog.done=(prog.done||0)+1;save();cnt();
        var last=k===qs.length-1;
        document.getElementById("fb").innerHTML="<div class='why"+(o.c?"":" no")+"'><p><b>"+(o.c?"Correct.":"Not quite.")+"</b> "+q.e+"</p></div><button class='cta' id='nx'>"+(last?"See my score":"Next question")+"</button>";
        var n=document.getElementById("nx");n.focus();
        n.onclick=function(){k++;if(k<qs.length){show()}else{done()}};
      };
      box.appendChild(b);
    });
  }
  function done(){
    if(title=="Daily 5"&&prog.day!=today()){prog.streak=prog.day==today(1)?(prog.streak||0)+1:1;prog.day=today();save()}
    if(t&&score>(prog.best[t.id]||0)){prog.best[t.id]=score;save()}
    var msg=score===qs.length?"Full marks. Every question right.":score>=qs.length/2?"Solid work. Go again to lock it in.":"Good start. Read the facts, then try again.";
    app.innerHTML="<h2>Quiz complete</h2><div class='score'>"+score+"/"+qs.length+"</div><p>"+msg+"</p><div class='acts'><button class='cta' id='ag'>Go again</button><button class='ghost' id='tp'>All topics</button></div>";
    document.getElementById("ag").onclick=function(){quiz(t?shuf(t.q):shuf([].concat.apply([],T.map(function(x){return x.q}))).slice(0,10),title,t)};
    document.getElementById("tp").onclick=subject;
    window.scrollTo(0,0);
  }
  show();window.scrollTo(0,0);
}
document.getElementById("home").onclick=home;
home();
</script>
